[project]
name = "stockdesk"
version = "0.1.0"
description = "AI research agent for US public companies using SEC filings, price data and technical indicators."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.8.4",
    "langchain-openai>=1.8.5",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.2.0",
    "pgvector",
    "psycopg[binary]",
    "pydantic-settings",
    "pypdf>=7.1.1",
    "python-dotenv",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
