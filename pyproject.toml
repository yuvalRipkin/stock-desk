[project]
name = "stockdesk"
version = "0.1.0"
description = "AI research agent for US public companies using SEC filings, price data and technical indicators."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pgvector",
    "psycopg[binary]",
    "pydantic-settings",
    "python-dotenv",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
