# Runs the project's own ruff (pinned in uv.lock), so hooks, `make lint` and CI agree.
# Installed by `make install`; run on everything with `uv run pre-commit run --all-files`.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
